        <!-- editorial-notes --><text x="50" y="711" class="t-muted" font-size="12">ssh-keygen creates a key pair; it does not authorize a GitHub account by itself.</text><text x="50" y="734" class="t-muted" font-size="12">A package-manager install supplies tools. No project history is created here.</text></g><text x="50" y="859" fill="#526574" font-size="10">LEOGUOLABS / GIT, THE AI-NATIVE WAY / CONCEPTUAL DIAGRAM 04</text></svg>