<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="645" viewBox="0 0 1020 645"><style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="37" fill="#163145" style="font-family:Georgia,serif" font-size="28" font-weight="700">Staging freezes a selection of content</text><text x="50" y="63" fill="#526574" style="font-family:Arial,sans-serif" font-size="14">The staged version and the working version can differ.</text><g transform="translate(0,78)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 270 134 L 400 134" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 620 134 L 750 134" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 510 173 L 510 330" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 860 173 L 860 330" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Components -->
        <rect x="50" y="95" width="220" height="78" rx="6" class="c-mask"/>
        <rect x="50" y="95" width="220" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="160" y="132" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">HEAD: version A</text>
        <text x="160" y="148" class="t-muted" font-size="11" text-anchor="middle">Last recorded snapshot</text>

        <rect x="400" y="95" width="220" height="78" rx="6" class="c-mask"/>
        <rect x="400" y="95" width="220" height="78" rx="6" class="c-messagebus" stroke-width="1.5"/>
        <text x="510" y="132" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">INDEX: version B</text>
        <text x="510" y="148" class="t-muted" font-size="11" text-anchor="middle">Selected for next commit</text>

        <rect x="750" y="95" width="220" height="78" rx="6" class="c-mask"/>
        <rect x="750" y="95" width="220" height="78" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="860" y="132" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">FILES: version C</text>
        <text x="860" y="148" class="t-muted" font-size="11" text-anchor="middle">Edited again after staging</text>

        <rect x="400" y="330" width="220" height="78" rx="6" class="c-mask"/>
        <rect x="400" y="330" width="220" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="510" y="367" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">NEW HEAD: B</text>
        <text x="510" y="383" class="t-muted" font-size="11" text-anchor="middle">git commit records the index</text>

        <rect x="750" y="330" width="220" height="78" rx="6" class="c-mask"/>
        <rect x="750" y="330" width="220" height="78" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="860" y="367" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">FILES STILL: C</text>
        <text x="860" y="383" class="t-muted" font-size="11" text-anchor="middle">Later edits remain unstaged</text>

        <!-- Connection labels -->
        <rect x="271.05" y="112" width="127.9" height="17" rx="3" class="c-mask"/><text x="335" y="124" class="t-messagebus" font-size="11" text-anchor="middle">git diff --staged</text>
        <rect x="651.2" y="112" width="67.6" height="17" rx="3" class="c-mask"/><text x="685" y="124" class="t-messagebus" font-size="11" text-anchor="middle">git diff</text>
        <rect x="399.5" y="238" width="81" height="17" rx="3" class="c-mask"/><text x="440" y="250" class="t-backend" font-size="11" text-anchor="middle">git commit</text>
        <rect x="887.85" y="238" width="74.30000000000001" height="17" rx="3" class="c-mask"/><text x="925" y="250" class="t-backend" font-size="11" text-anchor="middle">unchanged</text>

        <!-- editorial-notes --><text x="50" y="463" class="t-muted" font-size="12">Dashed arrows compare snapshots without changing them.</text><text x="50" y="486" class="t-muted" font-size="12">git add again would update the index from the later working content.</text><text x="50" y="509" class="t-muted" font-size="12">To verify the commit itself, test the committed snapshot rather than an unrelated working state.</text></g><text x="50" y="634" fill="#526574" font-size="10">LEOGUOLABS / GIT, THE AI-NATIVE WAY / CONCEPTUAL DIAGRAM 07</text></svg>