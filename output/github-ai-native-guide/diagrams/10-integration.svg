<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"><style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="37" fill="#163145" style="font-family:Georgia,serif" font-size="28" font-weight="700">Two ways to integrate another line of work</text><text x="50" y="63" fill="#526574" style="font-family:Arial,sans-serif" font-size="14">Illustrative commit identities; arrows follow history toward newer commits.</text><g transform="translate(0,78)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 105 180 L 105 120 Q 105 112 113 112 L 325 112" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 105 244 L 105 304 Q 105 312 113 312 L 325 312" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 520 112 L 827 112 Q 835 112 835 120 L 835 180" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 520 312 L 827 312 Q 835 312 835 304 L 835 244" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 160 517 L 325 517" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 520 517 L 720 517" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Components -->
        <rect x="50" y="180" width="110" height="64" rx="6" class="c-mask"/>
        <rect x="50" y="180" width="110" height="64" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="105" y="210" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">A</text>
        <text x="105" y="226" class="t-muted" font-size="11" text-anchor="middle">Shared base</text>

        <rect x="325" y="80" width="195" height="64" rx="6" class="c-mask"/>
        <rect x="325" y="80" width="195" height="64" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="422.5" y="110" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">B on main</text>
        <text x="422.5" y="126" class="t-muted" font-size="11" text-anchor="middle">Existing commit</text>

        <rect x="325" y="280" width="195" height="64" rx="6" class="c-mask"/>
        <rect x="325" y="280" width="195" height="64" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="422.5" y="310" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">C on task</text>
        <text x="422.5" y="326" class="t-muted" font-size="11" text-anchor="middle">Existing commit</text>

        <rect x="720" y="180" width="230" height="64" rx="6" class="c-mask"/>
        <rect x="720" y="180" width="230" height="64" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="835" y="210" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">M: merge commit</text>
        <text x="835" y="226" class="t-muted" font-size="11" text-anchor="middle">Parents are B and C</text>

        <rect x="50" y="485" width="110" height="64" rx="6" class="c-mask"/>
        <rect x="50" y="485" width="110" height="64" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="105" y="515" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">A</text>
        <text x="105" y="531" class="t-muted" font-size="11" text-anchor="middle">Shared base</text>

        <rect x="325" y="485" width="195" height="64" rx="6" class="c-mask"/>
        <rect x="325" y="485" width="195" height="64" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="422.5" y="515" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">B on main</text>
        <text x="422.5" y="531" class="t-muted" font-size="11" text-anchor="middle">New base for task</text>

        <rect x="720" y="485" width="230" height="64" rx="6" class="c-mask"/>
        <rect x="720" y="485" width="230" height="64" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="835" y="515" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Replayed commit C′</text>
        <text x="835" y="531" class="t-muted" font-size="11" text-anchor="middle">New commit identity</text>

        <!-- Connection labels -->





        <rect x="579.5" y="494" width="81" height="17" rx="3" class="c-mask"/><text x="620" y="506" class="t-backend" font-size="11" text-anchor="middle">git rebase</text>

        <!-- editorial-notes --><text x="50" y="28" class="t-primary" font-size="14" font-weight="600">MERGE / git merge joins both histories</text><text x="50" y="435" class="t-primary" font-size="14" font-weight="600">REBASE / replay the task on the current main</text><text x="50" y="641" class="t-muted" font-size="12">--ff-only advances a reference only when it can fast-forward; it refuses divergent history.</text><text x="50" y="664" class="t-muted" font-size="12">git merge --abort attempts to return to the pre-merge state. Preserve unfinished work first.</text></g><text x="50" y="789" fill="#526574" font-size="10">LEOGUOLABS / GIT, THE AI-NATIVE WAY / CONCEPTUAL DIAGRAM 10</text></svg>