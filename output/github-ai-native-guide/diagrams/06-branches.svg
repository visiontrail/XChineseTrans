<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="37" fill="#163145" style="font-family:Georgia,serif" font-size="28" font-weight="700">A branch names history; a worktree holds files</text><text x="50" y="63" fill="#526574" style="font-family:Arial,sans-serif" font-size="14">Separate working areas can share the same repository history.</text><g transform="translate(0,78)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 150 190 L 150 127 Q 150 119 158 119 L 360 119" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 150 268 L 150 331 Q 150 339 158 339 L 360 339" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 600 119 L 710 119" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 600 339 L 710 339" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Components -->
        <rect x="50" y="190" width="200" height="78" rx="6" class="c-mask"/>
        <rect x="50" y="190" width="200" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="150" y="227" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Base commit A</text>
        <text x="150" y="243" class="t-muted" font-size="11" text-anchor="middle">Chosen starting revision</text>

        <rect x="360" y="80" width="240" height="78" rx="6" class="c-mask"/>
        <rect x="360" y="80" width="240" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="480" y="117" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">main points to B</text>
        <text x="480" y="133" class="t-muted" font-size="11" text-anchor="middle">Main history advances</text>

        <rect x="360" y="300" width="240" height="78" rx="6" class="c-mask"/>
        <rect x="360" y="300" width="240" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="480" y="337" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">task points to C</text>
        <text x="480" y="353" class="t-muted" font-size="11" text-anchor="middle">One focused change</text>

        <rect x="710" y="80" width="240" height="78" rx="6" class="c-mask"/>
        <rect x="710" y="80" width="240" height="78" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="830" y="117" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Main checkout</text>
        <text x="830" y="133" class="t-muted" font-size="11" text-anchor="middle">Working files + its index</text>

        <rect x="710" y="300" width="240" height="78" rx="6" class="c-mask"/>
        <rect x="710" y="300" width="240" height="78" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="830" y="337" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Agent worktree</text>
        <text x="830" y="353" class="t-muted" font-size="11" text-anchor="middle">Separate files + its index</text>

        <!-- Connection labels -->





        <!-- editorial-notes --><text x="50" y="458" class="t-muted" font-size="12">git switch -c creates and selects a branch; git switch changes the current checkout.</text><text x="50" y="481" class="t-muted" font-size="12">git worktree add creates another checkout. Uncommitted edits are not copied automatically.</text><text x="50" y="504" class="t-muted" font-size="12">Branch creation is not a commit. The chosen starting revision still matters.</text></g><text x="50" y="629" fill="#526574" font-size="10">LEOGUOLABS / GIT, THE AI-NATIVE WAY / CONCEPTUAL DIAGRAM 06</text></svg>