<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="610" viewBox="0 0 1030 610"><style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="37" fill="#163145" style="font-family:Georgia,serif" font-size="28" font-weight="700">Where an agent moves the work</text><text x="50" y="63" fill="#526574" style="font-family:Arial,sans-serif" font-size="14">Each transition establishes a different result.</text><g transform="translate(0,78)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 220 139 L 300 139" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 470 139 L 550 139" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 720 139 L 800 139" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 885 178 L 885 237 Q 885 245 877 245 L 643 245 Q 635 245 635 237 L 635 178" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 970 139 L 987 139 Q 995 139 995 147 L 995 361 Q 995 369 987 369 L 970 369" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 800 369 L 720 369" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Components -->
        <rect x="50" y="100" width="170" height="78" rx="6" class="c-mask"/>
        <rect x="50" y="100" width="170" height="78" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="135" y="137" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Working files</text>
        <text x="135" y="153" class="t-muted" font-size="11" text-anchor="middle">Current edits</text>

        <rect x="300" y="100" width="170" height="78" rx="6" class="c-mask"/>
        <rect x="300" y="100" width="170" height="78" rx="6" class="c-messagebus" stroke-width="1.5"/>
        <text x="385" y="137" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Index</text>
        <text x="385" y="153" class="t-muted" font-size="11" text-anchor="middle">Next snapshot</text>

        <rect x="550" y="100" width="170" height="78" rx="6" class="c-mask"/>
        <rect x="550" y="100" width="170" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="635" y="137" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Local history</text>
        <text x="635" y="153" class="t-muted" font-size="11" text-anchor="middle">Commits + branches</text>

        <rect x="800" y="100" width="170" height="78" rx="6" class="c-mask"/>
        <rect x="800" y="100" width="170" height="78" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="885" y="137" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Remote branch</text>
        <text x="885" y="153" class="t-muted" font-size="11" text-anchor="middle">Shared history</text>

        <rect x="800" y="330" width="170" height="78" rx="6" class="c-mask"/>
        <rect x="800" y="330" width="170" height="78" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="885" y="367" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Pull request</text>
        <text x="885" y="383" class="t-muted" font-size="11" text-anchor="middle">Review + integration</text>

        <rect x="550" y="330" width="170" height="78" rx="6" class="c-mask"/>
        <rect x="550" y="330" width="170" height="78" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="635" y="367" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Delivered site</text>
        <text x="635" y="383" class="t-muted" font-size="11" text-anchor="middle">Observed at real URL</text>

        <!-- Connection labels -->
        <rect x="229.55" y="117" width="60.9" height="17" rx="3" class="c-mask"/><text x="260" y="129" class="t-backend" font-size="11" text-anchor="middle">git add</text>
        <rect x="469.5" y="117" width="81" height="17" rx="3" class="c-mask"/><text x="510" y="129" class="t-backend" font-size="11" text-anchor="middle">git commit</text>
        <rect x="726.2" y="117" width="67.6" height="17" rx="3" class="c-mask"/><text x="760" y="129" class="t-backend" font-size="11" text-anchor="middle">git push</text>
        <rect x="722.85" y="252" width="74.30000000000001" height="17" rx="3" class="c-mask"/><text x="760" y="264" class="t-messagebus" font-size="11" text-anchor="middle">git fetch</text>

        <rect x="702.75" y="291" width="114.5" height="17" rx="3" class="c-mask"/><text x="760" y="303" class="t-backend" font-size="11" text-anchor="middle">deploy + verify</text>

        <!-- editorial-notes --><text x="50" y="451" class="t-muted" font-size="12">Local commit does not mean remote publication.</text><text x="50" y="474" class="t-muted" font-size="12">A merged PR does not prove a working deployment.</text></g><text x="50" y="599" fill="#526574" font-size="10">LEOGUOLABS / GIT, THE AI-NATIVE WAY / CONCEPTUAL DIAGRAM 03</text></svg>