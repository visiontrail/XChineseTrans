<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840"><style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Menlo,Consolas,monospace}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="37" fill="#163145" style="font-family:Georgia,serif" font-size="28" font-weight="700">Follow the direction of the data</text><text x="50" y="63" fill="#526574" style="font-family:Arial,sans-serif" font-size="14">Fork, clone, fetch, push, and PR target different places.</text><g transform="translate(0,78)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 310 139 L 690 139" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 815 100 L 815 48 Q 815 40 807 40 L 193 40 Q 185 40 185 48 L 185 100" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)"/>
        <path d="M 815 178 L 815 252 Q 815 260 807 260 L 508 260 Q 500 260 500 268 L 500 370" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 185 178 L 185 401 Q 185 409 193 409 L 375 409" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 625 409 L 972 409 Q 980 409 980 401 L 980 147 Q 980 139 972 139 L 940 139" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 500 560 L 500 448" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>

        <!-- Components -->
        <rect x="60" y="100" width="250" height="78" rx="6" class="c-mask"/>
        <rect x="60" y="100" width="250" height="78" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="185" y="137" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Original repository</text>
        <text x="185" y="153" class="t-muted" font-size="11" text-anchor="middle">Remote name: upstream</text>

        <rect x="690" y="100" width="250" height="78" rx="6" class="c-mask"/>
        <rect x="690" y="100" width="250" height="78" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="815" y="137" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Your GitHub fork</text>
        <text x="815" y="153" class="t-muted" font-size="11" text-anchor="middle">Remote name: origin</text>

        <rect x="375" y="370" width="250" height="78" rx="6" class="c-mask"/>
        <rect x="375" y="370" width="250" height="78" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="500" y="407" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Local repository</text>
        <text x="500" y="423" class="t-muted" font-size="11" text-anchor="middle">Commits + working checkout</text>

        <rect x="375" y="560" width="250" height="78" rx="6" class="c-mask"/>
        <rect x="375" y="560" width="250" height="78" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="500" y="597" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">git remote add / -v</text>
        <text x="500" y="613" class="t-muted" font-size="11" text-anchor="middle">Register / inspect destinations</text>

        <!-- Connection labels -->
        <rect x="446.1" y="113" width="107.8" height="17" rx="3" class="c-mask"/><text x="500" y="125" class="t-backend" font-size="11" text-anchor="middle">Fork on GitHub</text>
        <rect x="385.8" y="13" width="228.4" height="17" rx="3" class="c-mask"/><text x="500" y="25" class="t-security" font-size="11" text-anchor="middle">PR: fork head into upstream base</text>
        <rect x="562.6" y="233" width="174.8" height="17" rx="3" class="c-mask"/><text x="650" y="245" class="t-backend" font-size="11" text-anchor="middle">git clone / fetch origin</text>
        <rect x="117.69999999999999" y="283" width="134.60000000000002" height="17" rx="3" class="c-mask"/><text x="185" y="295" class="t-backend" font-size="11" text-anchor="middle">git fetch upstream</text>
        <rect x="854.7" y="298" width="134.60000000000002" height="17" rx="3" class="c-mask"/><text x="922" y="310" class="t-backend" font-size="11" text-anchor="middle">git push -u origin</text>


        <!-- editorial-notes --><text x="50" y="681" class="t-muted" font-size="12">origin and upstream are conventions, not special servers. Inspect the actual URLs.</text><text x="50" y="704" class="t-muted" font-size="12">The -u option establishes a branch tracking relationship after a successful push.</text></g><text x="50" y="829" fill="#526574" font-size="10">LEOGUOLABS / GIT, THE AI-NATIVE WAY / CONCEPTUAL DIAGRAM 09</text></svg>