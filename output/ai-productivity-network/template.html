<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$pagetitle$ — LeoGuoLabs</title>
<style>
:root{color-scheme:light;--paper:#f7f2e8;--ink:#102638;--muted:#586466;--teal:#366e70;--orange:#ad582e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.75 Georgia,serif}header{max-width:1120px;margin:auto;padding:30px 32px 22px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #cfc8bc;gap:18px}header strong{font-size:27px;letter-spacing:-1px}header span,figcaption,footer{font:12px/1.6 'Trebuchet MS',sans-serif;color:var(--muted)}main{max-width:1024px;margin:56px auto 80px;padding:0 32px}h1{max-width:820px;font-size:clamp(39px,6.3vw,70px);line-height:1.06;font-weight:500;letter-spacing:-2px;margin:0 auto 36px}p,h2{max-width:730px;margin-left:auto;margin-right:auto}h2{font-size:31px;line-height:1.22;margin-top:62px;margin-bottom:22px;font-weight:500}p{margin-top:0;margin-bottom:25px}h1+p{font-size:24px;line-height:1.5}a{color:var(--teal);text-underline-offset:4px}figure{margin:40px 0 52px}figure img{display:block;width:100%;height:auto;border-radius:2px;cursor:zoom-in}figcaption{margin-top:10px}footer{max-width:1120px;margin:auto;padding:25px 32px 36px;border-top:1px solid #cfc8bc;display:flex;justify-content:space-between;gap:20px}dialog{max-width:96vw;max-height:94vh;border:0;padding:14px;background:var(--paper)}dialog::backdrop{background:#102638de}dialog img{display:block;max-width:90vw;max-height:82vh;object-fit:contain}button{display:block;margin:0 0 12px auto;background:var(--ink);color:var(--paper);border:0;padding:10px 16px;font:14px 'Trebuchet MS',sans-serif;cursor:pointer}img:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:5px}@media(max-width:600px){body{font-size:18px;line-height:1.7}header{padding:22px;flex-wrap:wrap;gap:4px}header span{width:100%}main{margin:34px auto 50px;padding:0 22px}h1{letter-spacing:-1px;margin-bottom:28px}h1+p{font-size:22px}h2{font-size:28px;margin-top:44px}figure{margin:30px -10px 36px}figcaption{padding:0 10px}footer{padding:22px;flex-direction:column;gap:4px}}
</style></head><body>
<header><strong>LeoGuoLabs</strong><span>FIELD NOTES / AI &amp; ECONOMIC VALUE</span></header>
<main><article>$body$</article></main>
<footer><span>LeoGuoLabs · Practical AI, with evidence.</span><span>AI-generated conceptual illustrations</span></footer>
<dialog aria-label="Image preview"><button type="button">Close ×</button><img alt=""></dialog>
<script>
const d=document.querySelector('dialog'),v=d.querySelector('img');let origin;document.querySelectorAll('article img').forEach(i=>{i.tabIndex=0;i.setAttribute('role','button');i.setAttribute('aria-label','Enlarge: '+i.alt);const open=()=>{origin=i;v.src=i.src;v.alt=i.alt;d.showModal()};i.addEventListener('click',open);i.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});d.querySelector('button').onclick=()=>d.close();d.addEventListener('close',()=>origin?.focus({preventScroll:true}));
</script></body></html>
