<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480">
    <style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Arial,Helvetica,sans-serif}</style>
    <rect width="100%" height="100%" fill="#f8fafc"/>
    <text x="40" y="38" fill="#102839" font-family="Arial,sans-serif" font-size="27" font-weight="700">Where your work lives</text>
    <text x="40" y="63" fill="#526574" font-family="Arial,sans-serif" font-size="14">Each command moves work to a different state.</text>
    <g transform="translate(0,75)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->
        <rect x="40" y="70" width="700" height="116" rx="12" class="c-region" stroke-width="1"/>
        <text x="48" y="88" class="t-cloud" font-size="11" font-weight="600">YOUR COMPUTER</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 230 133 L 310 133" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 470 133 L 550 133" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 710 133 L 820 133" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 900 166 L 900 212 Q 900 220 892 220 L 638 220 Q 630 220 630 212 L 630 166" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 980 133 L 997 133 Q 1005 133 1005 141 L 1005 300 Q 1005 308 997 308 L 980 308" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)"/>

        <!-- Components -->
        <rect x="70" y="100" width="160" height="66" rx="6" class="c-mask"/>
        <rect x="70" y="100" width="160" height="66" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="150" y="131" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Working files</text>
        <text x="150" y="147" class="t-muted" font-size="11" text-anchor="middle">Your current edits</text>

        <rect x="310" y="100" width="160" height="66" rx="6" class="c-mask"/>
        <rect x="310" y="100" width="160" height="66" rx="6" class="c-messagebus" stroke-width="1.5"/>
        <text x="390" y="131" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Staging area</text>
        <text x="390" y="147" class="t-muted" font-size="11" text-anchor="middle">The next snapshot</text>

        <rect x="550" y="100" width="160" height="66" rx="6" class="c-mask"/>
        <rect x="550" y="100" width="160" height="66" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="630" y="131" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Local repository</text>
        <text x="630" y="147" class="t-muted" font-size="11" text-anchor="middle">Commits + branches</text>

        <rect x="820" y="100" width="160" height="66" rx="6" class="c-mask"/>
        <rect x="820" y="100" width="160" height="66" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="900" y="131" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">GitHub repository</text>
        <text x="900" y="147" class="t-muted" font-size="11" text-anchor="middle">Shared branches</text>

        <rect x="820" y="275" width="160" height="66" rx="6" class="c-mask"/>
        <rect x="820" y="275" width="160" height="66" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="900" y="306" class="t-primary" font-size="14" font-weight="600" text-anchor="middle">Pull request</text>
        <text x="900" y="322" class="t-muted" font-size="11" text-anchor="middle">Review + checks</text>

        <!-- Connection labels -->
        
        <text x="270" y="123" class="t-backend" font-size="11" text-anchor="middle">git add</text>
        
        <text x="510" y="123" class="t-backend" font-size="11" text-anchor="middle">git commit</text>
        
        <text x="765" y="123" class="t-backend" font-size="11" text-anchor="middle">git push</text>
        
        <text x="760" y="235" class="t-messagebus" font-size="11" text-anchor="middle">git fetch</text>


        <!-- editorial-refinement -->
        <rect x="70" y="270" width="310" height="70" rx="6" class="c-external"/>
        <text x="86" y="292" class="t-primary" font-size="13" font-weight="600">Stage the content you intend.</text>
        <text x="86" y="314" class="t-muted" font-size="11">Later edits need another git add.</text>
        <rect x="410" y="270" width="335" height="70" rx="6" class="c-external"/>
        <text x="426" y="292" class="t-primary" font-size="13" font-weight="600">Fetch is a download, not a merge.</text>
        <text x="426" y="314" class="t-muted" font-size="11">Inspect remote history before integrating.</text>
        </g>
    <text x="40" y="467" fill="#526574" font-family="Arial,sans-serif" font-size="10">LEOGUOLABS  /  GITHUB FIELD GUIDE  /  CONCEPTUAL DIAGRAM</text>
  </svg>