<svg xmlns="http://www.w3.org/2000/svg" width="720" height="535" viewBox="0 0 720 535">
    <style>    .c-grid       { stroke: #e2e8f0; fill: none; }
    .c-mask       { fill: #ffffff; stroke: none; }

    .c-frontend   { fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2; }
    .c-backend    { fill: rgba(52, 211, 153, 0.18);    stroke: #059669; }
    .c-database   { fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
    .c-cloud      { fill: rgba(251, 191, 36, 0.18);      stroke: #d97706; }
    .c-security   { fill: rgba(251, 113, 133, 0.15);   stroke: #e11d48; }
    .c-messagebus { fill: rgba(251, 146, 60, 0.15); stroke: #ea580c; }
    .c-external   { fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }

    /* Text helpers */
    .t-primary { fill: #0f172a; }
    .t-muted   { fill: #64748b; }
    .t-dim     { fill: #94a3b8; }
    .t-frontend   { fill: #0891b2; }
    .t-backend    { fill: #059669; }
    .t-database   { fill: #7c3aed; }
    .t-cloud      { fill: #d97706; }
    .t-security   { fill: #e11d48; }
    .t-messagebus { fill: #ea580c; }
    .t-external   { fill: #64748b; }

    /* Arrows */
    .a-default   { stroke: #94a3b8; fill: none; }
    .a-emphasis  { stroke: #059669; fill: none; }
    .a-security  { stroke: #e11d48; fill: none; stroke-dasharray: 5,5; }
    .a-dashed    { stroke: #7c3aed; fill: none; stroke-dasharray: 4,4; }

    /* Arrowhead markers reference these */
    .m-default   { fill: #94a3b8; }
    .m-emphasis  { fill: #059669; }
    .m-security  { fill: #e11d48; }
    .m-dashed    { fill: #7c3aed; }

    /* Dashed boundary variants */
    .c-security-group { fill: transparent; stroke: #e11d48; stroke-dasharray: 4,4; }
    .c-region         { fill: rgba(251, 191, 36, 0.05); stroke: #d97706; stroke-dasharray: 8,4; }
    .c-lane           { fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6; }
  
text{font-family:Arial,Helvetica,sans-serif}</style>
    <rect width="100%" height="100%" fill="#f8fafc"/>
    <text x="40" y="38" fill="#102839" font-family="Arial,sans-serif" font-size="23" font-weight="700">A change needs evidence at every handoff</text>
    <text x="40" y="63" fill="#526574" font-family="Arial,sans-serif" font-size="14">An example path from local edits to a usable static website.</text>
    <g transform="translate(0,75)">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Swimlanes -->
        <rect x="40" y="52" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="74" class="t-muted" font-size="10" font-weight="600">01 / LOCAL WORK</text>

        <rect x="40" y="176" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="198" class="t-muted" font-size="10" font-weight="600">02 / GITHUB REVIEW</text>

        <rect x="40" y="300" width="640" height="104" rx="10" class="c-lane" stroke-width="1"/>
        <text x="54" y="322" class="t-muted" font-size="10" font-weight="600">03 / DELIVERY</text>

        <!-- Edge paths -->
        <path d="M 134 119 L 242.5 119" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 357.5 119 L 579 119" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 625 145 L 625 166 L 625 166 L 625 217" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 579 243 L 357.5 243" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 242.5 243 L 134 243" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 88 269 L 88 278 Q 88 284 82 284 L 31 284 Q 25 284 25 290 L 25 326 Q 25 332 31 332 L 82 332 Q 88 332 88 338 L 88 341" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 134 367 L 242.5 367" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 357.5 367 L 579 367" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <rect x="42" y="93" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="42" y="93" width="92" height="52" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="88" y="114" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Branch</text>
        <text x="88" y="131" class="t-muted" font-size="9" text-anchor="middle">one change</text>

        <rect x="242.5" y="93" width="115" height="52" rx="6" class="c-mask"/>
        <rect x="242.5" y="93" width="115" height="52" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="300" y="114" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Edit + check</text>
        <text x="300" y="131" class="t-muted" font-size="9" text-anchor="middle">inspect the diff</text>

        <rect x="579" y="93" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="579" y="93" width="92" height="52" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="625" y="114" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Commit</text>
        <text x="625" y="131" class="t-muted" font-size="9" text-anchor="middle">local snapshot</text>

        <rect x="579" y="217" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="579" y="217" width="92" height="52" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="625" y="238" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Push + PR</text>
        <text x="625" y="255" class="t-muted" font-size="9" text-anchor="middle">correct base</text>

        <rect x="242.5" y="217" width="115" height="52" rx="6" class="c-mask"/>
        <rect x="242.5" y="217" width="115" height="52" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="300" y="238" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Review + CI</text>
        <text x="300" y="255" class="t-muted" font-size="9" text-anchor="middle">latest revision</text>

        <rect x="42" y="217" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="42" y="217" width="92" height="52" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="88" y="238" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Merge</text>
        <text x="88" y="255" class="t-muted" font-size="9" text-anchor="middle">integration</text>

        <rect x="42" y="341" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="42" y="341" width="92" height="52" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="88" y="362" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Deploy</text>
        <text x="88" y="379" class="t-muted" font-size="9" text-anchor="middle">release artifact</text>

        <rect x="242.5" y="341" width="115" height="52" rx="6" class="c-mask"/>
        <rect x="242.5" y="341" width="115" height="52" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="300" y="362" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Open live URL</text>
        <text x="300" y="379" class="t-muted" font-size="9" text-anchor="middle">test the behavior</text>

        <rect x="579" y="341" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="579" y="341" width="92" height="52" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="625" y="362" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Record</text>
        <text x="625" y="379" class="t-muted" font-size="9" text-anchor="middle">URL + revision</text>

        <!-- Edge labels -->









        <!-- editorial-refinement --></g>
    <text x="40" y="522" fill="#526574" font-family="Arial,sans-serif" font-size="10">LEOGUOLABS  /  GITHUB FIELD GUIDE  /  CONCEPTUAL DIAGRAM</text>
  </svg>