<!doctype html><meta charset="utf-8"><title>Article video layout review</title><style>body{margin:0;font:14px sans-serif;background:#eee}section{padding:12px}h2{font-size:16px}iframe{border:0;background:white}.desktop{height:400px;overflow:hidden}.desktop iframe{width:1280px;height:720px;transform:scale(.5);transform-origin:top left}.mobile iframe{width:390px;height:844px}</style><section><h2>Desktop: 1280 × 720 (shown at 50%)</h2><div class="desktop"><iframe id="desktop" src="article.html#four-outcomes-that-deserve-separate-checks"></iframe></div></section><section class="mobile"><h2>Mobile: 390 × 844</h2><iframe id="mobile" src="article.html#four-outcomes-that-deserve-separate-checks"></iframe></section><script>document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{const y=f.contentDocument.querySelector('video').getBoundingClientRect().top+f.contentWindow.scrollY; f.contentWindow.scrollTo(0,y-150); const v=f.contentDocument.querySelector('video'); const r={width:f.contentWindow.innerWidth,scrollWidth:f.contentDocument.documentElement.scrollWidth,videoWidth:v.getBoundingClientRect().width,videoHeight:v.getBoundingClientRect().height}; f.setAttribute('data-layout-check',JSON.stringify(r))}));</script>
