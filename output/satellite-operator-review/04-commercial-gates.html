</svg></div><div class="evidence"><p>建议把端到端用例作为 XY-2.1 的验证主线：终端接入 → 波束生效 → 业务承载 → 切换或异常恢复 → 日志及地面确认。扩波束评估应同时列明带宽、并发、处理与接口余量、功耗以及故障后的可用能力。商业运营关口属于系统与运营层，不应全部变成基带单机承诺。</p><ul class="sources"></ul><p><a href="index.html">返回四图总览</a></p></div></main></body></html>
